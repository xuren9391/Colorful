<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国色 · 传统色推荐与调色工具</title>
<meta name="description" content="661 种中国传统色：搜索取值、ΔE 最近传统色匹配、收藏导出 CSS 变量。">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 霞鹜文楷：圆润楷体，古风与柔和兼得；加载失败自动回退本机楷体/宋体 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">中国色<span class="logo-sub">传统色 · 调色</span></div>
  <div class="search-wrap" id="searchWrap">
    <input id="search" type="search" autocomplete="off"
           placeholder="搜索色名或拼音，如：胭脂 / yanzhi" aria-label="搜索色名或拼音">
  </div>
  <div class="topbar-actions">
    <button id="searchIcon" class="icon-btn" aria-label="展开搜索">搜</button>
    <button id="favBtn" class="fav-btn" aria-label="打开收藏夹">收藏夹<span id="favBadge" class="badge" hidden>0</span></button>
  </div>
</header>

<main class="layout">
  <section class="wall-side">

    <section class="hero" id="hero" title="查看今日一色详情">
      <div class="hero-tag">今日一色</div>
      <div class="hero-main">
        <div class="hero-name serif" id="heroName">加载中…</div>
        <div class="hero-hex" id="heroHex"></div>
      </div>
      <div class="hero-note serif" id="heroNote"></div>
    </section>

    <nav class="chips" id="chips" aria-label="色系筛选"></nav>

    <section class="wall" id="wall" aria-label="色卡墙">
      <!-- 骨架块由 app.js 填充 -->
    </section>

    <div id="wallMsg" class="wall-msg" hidden></div>
  </section>

  <aside class="mixer not-ready" id="mixer" aria-label="调色台">
    <div class="mixer-handle" id="mixerHandle" aria-hidden="true"></div>
    <h2 class="mixer-title">调色台</h2>

    <div class="mixer-preview" id="mixerPreview">
      <div class="mp-name serif" id="mpName">—</div>
      <div class="mp-hex" id="mpHex">#D5F0E6</div>
    </div>

    <div class="mixer-hex-row">
      <label class="hex-label" for="hexInput">HEX</label>
      <input id="hexInput" type="text" spellcheck="false" autocomplete="off"
             placeholder="#D5F0E6" aria-label="输入 HEX 色值">
    </div>
    <p class="hex-error" id="hexError" hidden>请输入 6 位 HEX，如 #D7213E</p>

    <div class="sliders" id="sliders">
      <div class="slider-row">
        <span class="slider-tag">H</span>
        <input type="range" id="hSlider" min="0" max="360" step="1" aria-label="色相">
        <span class="slider-val" id="hVal">0</span>
      </div>
      <div class="slider-row">
        <span class="slider-tag">S</span>
        <input type="range" id="sSlider" min="0" max="100" step="1" aria-label="饱和度">
        <span class="slider-val" id="sVal">0</span>
      </div>
      <div class="slider-row">
        <span class="slider-tag">L</span>
        <input type="range" id="lSlider" min="0" max="100" step="1" aria-label="明度">
        <span class="slider-val" id="lVal">0</span>
      </div>
    </div>

    <div class="nearest-head">最接近的传统色</div>
    <ol class="nearest" id="nearestList"></ol>
    <p class="mixer-hint">采纳后可微调，色名会标记来源</p>

    <button id="copyCurrent" class="btn primary block">复制当前色</button>
  </aside>
</main>

<button id="fab" class="fab" aria-label="打开调色台">调色</button>

<!-- 详情弹层 -->
<div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-label="颜色详情" hidden>
  <div class="modal-mask" data-close></div>
  <div class="modal-panel detail-panel">
    <button class="modal-close" data-close aria-label="关闭">✕</button>
    <div class="detail-block" id="detailBlock">
      <div class="db-name serif" id="dName"></div>
      <div class="db-pinyin" id="dPinyin"></div>
      <div class="db-hex" id="dHex"></div>
    </div>
    <div class="detail-body">
      <div class="value-rows">
        <div class="value-row"><span class="vr-tag">HEX</span><code id="dHexVal"></code>
          <button class="copy-mini" data-copy="hex">复制</button></div>
        <div class="value-row"><span class="vr-tag">RGB</span><code id="dRgbVal"></code>
          <button class="copy-mini" data-copy="rgb">复制</button></div>
        <div class="value-row"><span class="vr-tag">HSL</span><code id="dHslVal"></code>
          <button class="copy-mini" data-copy="hsl">复制</button></div>
      </div>
      <p class="detail-note serif" id="dNote" hidden></p>
      <div class="detail-actions">
        <button id="dStar" class="btn">☆ 收藏</button>
        <button id="dSend" class="btn primary">发送到调色台</button>
      </div>
      <div class="similar-head">相近色</div>
      <div class="similar" id="dSimilar"></div>
    </div>
  </div>
</div>

<!-- 收藏夹弹层 -->
<div class="modal" id="favModal" role="dialog" aria-modal="true" aria-label="收藏夹" hidden>
  <div class="modal-mask" data-close></div>
  <div class="modal-panel fav-panel">
    <button class="modal-close" data-close aria-label="关闭">✕</button>
    <h2 class="fav-title serif">收藏夹 <span id="favCount" class="fav-count"></span></h2>

    <div id="favEmpty" class="fav-empty" hidden>
      <p>还没有收藏，去色卡墙挑几个吧</p>
      <button class="btn" id="goWall">去逛色卡</button>
    </div>

    <div id="favList" class="fav-list"></div>

    <div id="favExportWrap" class="fav-export" hidden>
      <pre class="css-code" id="cssCode"></pre>
      <button id="copyCss" class="btn primary block">复制全部</button>
    </div>

    <div class="fav-foot" id="favFoot" hidden>
      <button id="exportCss" class="btn primary block">导出 CSS</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<div class="manual-copy" id="manualCopy" hidden>
  <input id="manualCopyInput" readonly aria-label="待复制内容">
  <span class="mc-hint">请手动复制</span>
  <button class="mc-close" id="manualCopyClose" aria-label="关闭">✕</button>
</div>

<script src="js/app.js"></script>
</body>
</html>
